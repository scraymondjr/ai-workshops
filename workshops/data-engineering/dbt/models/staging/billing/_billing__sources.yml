version: 2

sources:
  - name: billing
    schema: bronze
    description: Append-only billing extracts. loaded_at_field is the loader clock.
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: billing__subscriptions
      - name: billing__invoices
